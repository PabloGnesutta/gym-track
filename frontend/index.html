<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />

  <title>Gym Track</title>
  <meta name="description" content="Te ayuda en el entreno" />

  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

  <link rel="manifest" href="/static/manifest.json" />
  <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16x16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png" />

  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/classes.css" />
  <link rel="stylesheet" href="/css/logger.css" />
  <link rel="stylesheet" href="/css/cache-control.css" />
  <link rel="stylesheet" href="/css/btn.css" />
  <link rel="stylesheet" href="/css/input.css" />
  <link rel="stylesheet" href="/css/session.css" />
  <link rel="stylesheet" href="/css/auth.css" />
  <link rel="stylesheet" href="/css/analytics.css" />
  <link rel="stylesheet" href="/css/dialog.css" />
  <link rel="stylesheet" href="/css/muscles.css" />

  <script src="/js/app.js" type="module" defer></script>
</head>

<body>
  <!-- Application -->
  <div id="app">
    <!-- Auth (login/signup) -->
    <div id="authView" class="page">
      <form id="authForm" class="base-form">
        <h3 class="form-title"><span class="form-title-text">Iniciar Sesión</span></h3>
        <div class="form-content">
          <div id="authNameField" class="form-control display-none">
            <label for="authName">Nombre</label>
            <input type="text" name="authName" placeholder="Tu nombre" autocomplete="name" />
          </div>
          <div id="authEmailField" class="form-control">
            <label for="authEmail">Email</label>
            <input type="email" name="authEmail" placeholder="tu@email.com" autocomplete="email" />
          </div>
          <div id="authPasswordField" class="form-control">
            <label for="authPassword">Contraseña</label>
            <input type="password" name="authPassword" placeholder="Contraseña" autocomplete="current-password" />
          </div>
          <div id="authNewPasswordField" class="form-control display-none">
            <label for="authNewPassword">Nueva contraseña</label>
            <input type="password" name="authNewPassword" placeholder="Nueva contraseña" autocomplete="new-password" />
          </div>
          <div id="authNewPasswordConfirmField" class="form-control display-none">
            <label for="authNewPasswordConfirm">Repetir contraseña</label>
            <input type="password" name="authNewPasswordConfirm" placeholder="Repetir contraseña" autocomplete="new-password" />
          </div>
          <div class="submit"><!--  --></div>
          <button type="button" id="authForgotPasswordBtn" class="mode-toggle">¿Olvidaste tu contraseña?</button>
          <button type="button" id="authModeToggle" class="mode-toggle">¿No tenés cuenta? Creá una</button>
        </div>
      </form>
    </div>

    <header id="mainHeader">
      <div class="page-title"></div>
      <div class="header-icons">
        <div id="goBack2" class="go-back"></div>
        <div id="headerMenu" class="header-menu">
          <div id="headerMenuBtn"></div>
          <div class="header-menu-panel display-none">
            <div id="musclesMenuBtn" class="header-menu-item"></div>
            <div id="restTimerToggleBtn" class="header-menu-item"></div>
            <div id="viewLogsBtn" class="header-menu-item"></div>
            <div id="logoutBtn" class="header-menu-item"></div>
            <div id="headerMenuUserEmail" class="header-menu-email"></div>
          </div>
        </div>
      </div>
    </header>

    <div class="views">
      <!-- Exercise List -->
      <div id="exerciseListView" class="page">
        <div class="search-container">
          <label for="searchExercise"></label>
          <input type="text" name="search" id="searchExercise" placeholder="buscar" />
        </div>

        <div class="list">
          <!--  -->
        </div>
        <div class="btns">
          <div id="newExerciseBtn" role="button" class="base-button">&plus;</div>
        </div>
      </div>

      <!-- Single Exercise -->
      <div id="singleExerciseView" class="page">
        <div class="heading">
          <h3 class="name"><!-- --></h3>
          <div class="right-side">
            <div class="delete-btn"> <!--  --> </div>
            <div class="edit-btn"><!--  --></div>
          </div>
        </div>

        <form id="createSetForm" class="base-form" data-exercise-key="">
          <!-- Set Form (Create) -->
          <div class="form-content">
            <div class="numeric-inputs">
              <div class="form-control">
                <label for="weight">Peso (kg):</label>
                <input type="number" step="1" name="weight" />
              </div>
              <div class="form-control">
                <label for="reps">Reps:</label>
                <input type="number" step="1" name="reps" />
              </div>
            </div>
            <div class="submit"><!--  --></div>
          </div>
        </form>

        <div class="rest-timer hidden"><!--  --></div>

        <div class="exercise-history-section">
          <h4>Progreso</h4>
          <div class="exercise-history-chart"><!--  --></div>
        </div>

        <div class="session-history-container">
          <div class="session-history current-date-log"><!--  --></div>
          <div class="session-history previous-days-log"><!--  --></div>
        </div>
      </div>

      <!-- Analytics -->
      <div id="analyticsView" class="page">
        <div class="analytics-section">
          <h2>Balance muscular</h2>
          <p class="analytics-subtitle">Sets por grupo muscular, últimos 30 días</p>
          <div class="muscle-balance-list"><!--  --></div>
        </div>

        <div class="analytics-section">
          <h2>Frecuencia</h2>
          <p class="analytics-subtitle">Días entrenados por semana</p>
          <div class="frequency-chart"><!--  --></div>
        </div>

        <div class="analytics-section">
          <h2>Récords personales</h2>
          <p class="analytics-subtitle">Peso máximo y 1RM estimado por ejercicio</p>
          <div class="pr-list"><!--  --></div>
        </div>
      </div>

      <!-- Muscles -->
      <div id="musclesView" class="page">
        <div class="list muscles-list">
          <!--  -->
        </div>
      </div>
    </div>

    <!-- Modal -->
    <div id="main-modal" class="modal">
      <div class="backdrop">
        <div class="close-modal">&times;</div>
      </div>

      <div class="content">
        <!-- Exercise Form (Create/Edit) -->
        <form id="exerciseForm" class="base-form">
          <h3 class="form-title">Nuevo Ejercicio</h3>
          <div class="form-content">
            <div class="form-control">
              <label for="exerciseName">Nombre</label>
              <input type="text" name="exerciseName" />
            </div>
            <div class="form-control">
              <label for="muscles">Etiquetas, separadas por coma</label>
              <input type="text" name="muscles" />
            </div>
            <div class="submit"><!--  --></div>
          </div>
        </form>

        <!-- Session Form (Edit) -->
        <form id="sessionForm" class="base-form">
          <h3 class="form-title">Editar Sesión</h3>
          <div class="heading">
            <div class="session-label"></div>
            <div class="delete"></div>
          </div>
          <div class="inputs-header">
            <div class="weight">Peso</div>
            <div class="reps">Reps</div>
          </div>
          <div class="inputs">
            <!--  -->
          </div>
          <div class="notes">
            <h4 class="heading">Notas</h4>
            <textarea rows="4" name="sessionNotes" id="sessionNotes"></textarea>
          </div>
          <div class="submit"><!--  --></div>
        </form>
      </div>
    </div>

    <!-- Confirm/Alert Dialog (reusable, replaces every native confirm()/alert()) -->
    <div id="dialogOverlay" class="dialog-overlay display-none">
      <div class="dialog-backdrop"></div>
      <div class="dialog-box">
        <h3 class="dialog-title display-none"></h3>
        <p class="dialog-message"></p>
        <div class="dialog-actions">
          <button type="button" id="dialogCancelBtn" class="dialog-btn dialog-btn-cancel">Cancelar</button>
          <button type="button" id="dialogConfirmBtn" class="dialog-btn dialog-btn-confirm">Confirmar</button>
        </div>
      </div>
    </div>

    <!-- Bottom tab bar -->
    <div id="mainFooter">
      <div id="tabExercisesBtn"></div>
      <div id="tabAnalyticsBtn"></div>
    </div>
  </div>

  <!-- Cache update banner -->
  <div id="updateBanner" class="folded">
    <p>Hay una nueva versión disponible</p>
    <button id="refreshPageBtn">Refrescá la página para actualizar</button>
  </div>

  <!-- Logger -->
  <div id="logger" class="display-none">
    <div id="closeLogsBtn">
      <h4>Cerrar logs</h4>
    </div>
    <div id="cacheMajorVersion"></div>
    <div id="indexedDbVersion"></div>
    <div id="logs"></div>
  </div>
</body>

</html>
